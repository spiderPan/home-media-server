services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./config/plex:/config
      - ${MEDIA_DISK}/media-server/data/media:/data/media
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/radarr:/config
      - ${MEDIA_DISK}/media-server/data/media/movies:/movies
      - ${MEDIA_DISK}/media-server/data/torrents:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - media-net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/sonarr:/config
      - ${MEDIA_DISK}/media-server/data/media/tv:/tv
      - ${MEDIA_DISK}/media-server/data/torrents:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - media-net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - media-net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${MEDIA_DISK}/media-server/data/torrents:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - media-net

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - media-net

  bazarr:
    build: ./docker/bazarr/
    image: pan-bazarr # Gives your new image a name
    container_name: bazarr
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/bazarr:/config
      - ${MEDIA_DISK}/media-server/data/media/movies:/movies
      - ${MEDIA_DISK}/media-server/data/media/tv:/tv
      - ./docker/bazarr/providers/zimukuocr.py:/app/bazarr/bin/custom_libs/subliminal_patch/providers/zimuku.py
      - ./docker/bazarr/providers/subhd.py:/app/bazarr/bin/custom_libs/subliminal_patch/providers/yifysubtitles.py
      - ./docker/bazarr/test_subhd.py:/app/bazarr/test_subhd.py
      - ./docker/bazarr/test_zimuku.py:/app/bazarr/test_zimuku.py

    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - media-net

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-0.0.0.0}
      - HOMEPAGE_VAR_RADARR_KEY=${HOMEPAGE_RADARR_KEY}
      - HOMEPAGE_VAR_PROWLARR_KEY=${HOMEPAGE_PROWLARR_KEY}
      - HOMEPAGE_VAR_SONARR_KEY=${HOMEPAGE_SONARR_KEY}
      - HOMEPAGE_VAR_BAZARR_KEY=${HOMEPAGE_BAZARR_KEY}
      - HOMEPAGE_VAR_QBIT_USER=${HOMEPAGE_QBIT_USER}
      - HOMEPAGE_VAR_QBIT_PASS=${HOMEPAGE_QBIT_PASS}
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MEDIA_DISK}:/media/external:ro
    ports:
      - 80:3000
    restart: unless-stopped
    networks:
      - media-net

networks:
  media-net:
    driver: bridge
